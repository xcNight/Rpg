<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#14161c" />
    <title>最後一夜</title>
    <style>
      :root {
        --bg: #f2efe8;
        --fg: #23211c;
        --muted: #6a665c;
        --btn: #e2ded2;
        --btn-hover: #d6d1c3;
        --btn-border: #b9b3a1;
        --sel: #fff7d6;
        --veil: rgba(20, 22, 28, 0.82);
        --veil-fg: #f2efe8;
        --warn: #b3261e;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #14161c;
          --fg: #e8e6df;
          --muted: #a9a79f;
          --btn: #2a2e3a;
          --btn-hover: #353a49;
          --btn-border: #454b5c;
          --sel: #3d4458;
          --warn: #ff8a80;
        }
      }
      :root[data-theme='dark'] {
        --warn: #ff8a80;
        --bg: #14161c;
        --fg: #e8e6df;
        --muted: #a9a79f;
        --btn: #2a2e3a;
        --btn-hover: #353a49;
        --btn-border: #454b5c;
        --sel: #3d4458;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: none;
      }
      main {
        max-width: 832px;
        margin: 0 auto;
        padding: 12px 16px 24px;
        padding-left: max(16px, env(safe-area-inset-left));
        padding-right: max(16px, env(safe-area-inset-right));
        padding-bottom: max(24px, env(safe-area-inset-bottom));
      }
      h1 { font-size: 20px; margin: 4px 0 8px; }
      .hud { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-bottom: 8px; font-size: 15px; }
      .hud .spacer { flex: 1; }
      .hud .btns { display: flex; gap: 8px; width: 100%; }
      .hud .btns button { flex: 1; }
      button {
        background: var(--btn);
        color: inherit;
        border: 1px solid var(--btn-border);
        border-radius: 8px;
        padding: 0 12px;
        min-height: 44px;
        font: inherit;
        cursor: pointer;
        touch-action: manipulation;
      }
      button:hover { background: var(--btn-hover); }
      .stage { position: relative; }
      canvas { display: block; width: 100%; height: auto; border-radius: 6px; touch-action: none; cursor: pointer; }
      #roster { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px; }
      .unit { text-align: left; }
      .unit.sel { border-color: var(--fg); background: var(--sel); }
      .unit.dead { opacity: 0.45; cursor: default; }
      #overlay {
        position: absolute; inset: 0; display: flex; flex-direction: column; gap: 16px;
        align-items: center; justify-content: center; text-align: center; padding: 16px;
        background: var(--veil); color: var(--veil-fg); border-radius: 6px; font-size: 18px;
      }
      #overlay button { color: var(--fg); padding: 0 24px; }
      #overlay { overflow-y: auto; }
      #result .title { font-size: 20px; font-weight: 600; margin-bottom: 10px; }
      #result .stats { display: grid; gap: 4px; text-align: left; font-size: 15px; line-height: 1.5; }
      #overlay[hidden] { display: none; }
      .help { color: var(--muted); font-size: 14px; line-height: 1.6; }
      #day[hidden], #log[hidden], #roster[hidden] { display: none; }
      #day { margin-top: 8px; }
      #dayInfo { font-size: 15px; margin-bottom: 8px; }
      h2.sec { font-size: 15px; margin: 14px 0 6px; }
      #forecast {
        margin-bottom: 4px; padding: 8px 10px; border-radius: 8px; font-size: 14px; line-height: 1.6;
        border: 1px solid var(--btn-border); background: var(--btn);
      }
      #forecast.boss { border-color: var(--warn); }
      #forecast .warn { color: var(--warn); font-weight: 600; }
      .note { color: var(--muted); font-size: 13px; line-height: 1.6; margin: 0 0 8px; }
      #defense { display: grid; gap: 8px; }
      .jobrow button { min-width: 7em; }
      #jobs { display: grid; gap: 8px; }
      .jobrow {
        display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px;
        padding: 6px 10px; border: 1px solid var(--btn-border); border-radius: 8px; background: var(--btn);
      }
      .jobrow select {
        min-height: 44px; min-width: 7em; font: inherit; color: inherit; background: var(--bg);
        border: 1px solid var(--btn-border); border-radius: 8px; padding: 0 8px;
      }
      #jobHelp { color: var(--muted); font-size: 13px; line-height: 1.7; padding-left: 1.2em; margin: 8px 0; }
      button.primary { width: 100%; font-weight: 600; background: var(--fg); color: var(--bg); border-color: var(--fg); }
      #log {
        margin-top: 8px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--btn-border);
        background: var(--btn); font-size: 13px; line-height: 1.6;
      }
      @media (min-width: 640px) {
        #roster { grid-template-columns: repeat(4, 1fr); }
        .hud .btns { width: auto; }
        .hud .btns button { flex: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>最後一夜</h1>
      <div class="hud">
        <span id="time"></span>
        <span id="bell"></span>
        <span id="kills"></span>
        <span class="spacer"></span>
        <div class="btns">
          <button id="pause"></button>
          <button id="speed"></button>
          <button id="restart">重新開始</button>
        </div>
      </div>
      <div class="stage">
        <canvas id="game"></canvas>
        <div id="overlay" hidden>
          <div id="result"></div>
          <button id="again">再守一夜</button>
        </div>
      </div>
      <div id="log" hidden></div>
      <section id="day" hidden>
        <div id="dayInfo"></div>
        <div id="forecast"></div>
        <h2 class="sec">工作</h2>
        <div id="jobs"></div>
        <h2 class="sec">城防</h2>
        <p class="note">畫面上的黃色虛線框是缺口。敵人從西、東、南三側出現，北門最安全。封堵後敵人得花時間破壞路障，但也可能在外面聚成一群再一起衝進來；留缺口則會被引到固定的路線上。</p>
        <div id="defense"></div>
        <ul id="jobHelp"></ul>
        <button id="startNight" class="primary">入夜</button>
      </section>
      <div id="roster"></div>
      <p class="help">
        白天替每位鎮民指派工作，按「入夜」開始守城。夜晚點選鎮民（或按數字鍵 1 到 4），再點地面下令移動。鎮民會自動攻擊射程內的敵人，民兵會追擊駐守點附近的敵人。
        取消選取：電腦按滑鼠右鍵（或 Esc），手機再點一次已選取的鎮民。
        暫停時仍可下令（電腦可按空白鍵）。守住鐘樓直到黎明。手機橫放時畫面更大。
      </p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
